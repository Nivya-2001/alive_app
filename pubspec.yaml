name: alive_app
description: "Alive - Live Streaming App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

# ── Runtime dependencies ──────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

# ── Build-time only ───────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4   # ← only once, no config here

# ── Launcher icon config ──────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21

# ── Flutter config ────────────────────────────────────────────
flutter:
  uses-material-design: true
  assets:
    - assets/